services:
  php:
    build: .
    container_name: lab7_php
    volumes:
      - ./www:/var/www/html
      - ./data:/var/www/html/data  # монтируем папку data
    user: "1000:1000"  # запускаем от текущего пользователя

  nginx:
    image: nginx:alpine
    container_name: lab7_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
